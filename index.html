<style>

e-offset:2px}.editor table{border-collapse:collapse;table-layout:fixed;width:100%;max-width:100%;margin:10px 0}.editor td,.editor th{border:1px solid #222;padding:7px;min-width:0;overflow-wrap:anywhere;vertical-align:middle;text-align:center}.editor td:focus,.editor th:focus{outline:1px solid #4d8067}.editor span[style*="background-color"],.editor font[style*="background-color"]{padding:.08em .2em;border-radius:.16em;-webkit-box-decoration-break:clone;box-decoration-break:clone}.status{font-size:12px;color:#697067;padding:8px 2px}.hidden{display:none!important}.notesBar{display:flex;gap:6px;align-items:center;flex-wrap:wrap}.notesBar select{max-width:55%;padding:8px;border:1px solid var(--line);border-radius:9px;background:white}.hint{font-size:12px;color:#686d66;margin:8px 2px}

</style></head><body><div class="app"><div class="top"><div class="brand">俺の地理</div><div class="notesBar"><select id="notes" aria-label="ノートを選択"></select><button id="newNote">＋ ノート</button><button id="renameNote">名前変更</button><button id="deleteNote">ノート削除</button><button id="exportBtn">バックアップ</button><button id="importBtn">復元</button><input type="file" id="importInput" accept=".json,application/json" class="hidden"></div></div>
<div class="toolbar" aria-label="編集ツール"><select id="size" aria-label="文字サイズ"><option value="" disabled selected>文字サイズ</option><option value="16px">標準 16</option><option value="12px">小 12</option><option value="14px">やや小 14</option><option value="18px">大 18</option><option value="22px">特大 22</option><option value="28px">かなり大 28</option><option value="36px">最大 36</option></select><label title="文字色"><input type="color" id="color" value="#20231f" aria-label="文字色"></label><label title="文字背景色"><input type="color" id="highlight" value="#fff176" aria-label="文字の背景色"></label><span class="alignGroup" aria-label="文字揃え"><button data-cmd="justifyLeft">左</button><button data-cmd="justifyCenter">中央</button><button data-cmd="justifyRight">右</button></span><button id="photoBtn">写真を追加</button><input type="file" id="photoInput" accept="image/*" class="hidden"><button id="tableBtn">表を追加</button><button id="deleteElement">選択した写真・表を削除</button></div>
<div class="paper"><input id="noteTitle" class="noteTitle" placeholder="ノートのタイトル" maxlength="120"><div id="editor" class="editor" contenteditable="true" spellcheck="false"></div></div><div class="status" id="status">この端末のブラウザに自動保存されます。</div><div class="hint">文字を選択した状態で文字サイズを変更してください。写真や表をタップして選択してから「選択した写真・表を削除」。ノートはこの端末内だけに保存されるので、機種変更やブラウザのデータ削除に備えて、ときどき「バックアップ」で保存しておくと安心です。</div></div>
<script>
(()=>{'use strict';const KEY='ore-no-chiri-v1';const $=id=>document.getElementById(id);const editor=$('editor'),title=$('noteTitle'),notes=$('notes'),status=$('status');let db={},current='',selected=null,saveTimer=null,savedRange=null;
function uid(){return 'n'+Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function load(){try{db=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){db={}}if(!Object.keys(db).length){current=uid();db[current]={name:'地理ノート',title:'',html:''}}else current=Object.keys(db)[0];renderNotes();openNote(current)}
function persist(){if(!current||!db[current])return;db[current].title=title.value;db[current].html=editor.innerHTML;db[current].name=title.value.trim()||db[current].name||'無題ノート';try{localStorage.setItem(KEY,JSON.stringify(db));status.textContent='保存済み · この端末のブラウザ内に保存';renderNotes(false)}catch(e){status.textContent='保存できません。写真を小さくするか、不要な写真を削除してください。'}}
function schedule(){status.textContent='保存中…';clearTimeout(saveTimer);saveTimer=setTimeout(persist,350)}
function renderNotes(reset=true){const old=notes.value;notes.innerHTML='';Object.keys(db).forEach(id=>{const o=document.createElement('option');o.value=id;o.textContent=db[id].name||'無題ノート';notes.appendChild(o)});if(db[current])notes.value=current;else if(db[old])notes.value=old}
function openNote(id){if(!db[id])return;current=id;title.value=db[id].title||'';editor.innerHTML=db[id].html||'';clearSelection();renderNotes();status.textContent='この端末のブラウザに自動保存されます。';updateColorControls()}
function clearSelection(){editor.querySelectorAll('.chosen').forEach(x=>x.classList.remove('chosen'));selected=null}
function selectElement(el){clearSelection();selected=el;el.classList.add('chosen')}
function colorToHex(value,fallback){if(!value)return fallback;if(value[0]==='#')return value;const m=value.match(/rgba?\((\d+)[, ]+\s*(\d+)[, ]+\s*(\d+)/i);if(!m)return fallback;return '#'+[m[1],m[2],m[3]].map(x=>Number(x).toString(16).padStart(2,'0')).join('')}
function updateColorControls(){const sel=window.getSelection();if(!sel||!sel.rangeCount)return;let node=sel.focusNode;if(node&&node.nodeType===3)node=node.parentElement;if(!node||!editor.contains(node))return;const textColor=getComputedStyle(node).color;$('color').value=colorToHex(textColor,'#20231f');let el=node,bg='#ffffff';while(el&&el!==editor){const c=getComputedStyle(el).backgroundColor;if(c&&c!=='transparent'&&c!=='rgba(0, 0, 0, 0)'){bg=colorToHex(c,'#ffffff');break}el=el.parentElement}$('highlight').value=bg;
const sz=getComputedStyle(node).fontSize;const sOpt=Array.from($('size').options).find(o=>o.value===sz);if(sOpt)$('size').value=sz;else $('size').value=""}

function saveSelection(){const sel=window.getSelection();if(sel&&sel.rangeCount){const r=sel.getRangeAt(0);if(editor.contains(r.commonAncestorContainer)){savedRange=r.cloneRange()}}}
function restoreEditorSelection(){editor.focus();if(savedRange){const sel=window.getSelection();sel.removeAllRanges();sel.addRange(savedRange)}}

editor.addEventListener('click',e=>{const el=e.target.closest('img,table');if(el&&editor.contains(el)){selectElement(el)}else clearSelection();setTimeout(updateColorControls,0)});
editor.addEventListener('keyup',updateColorControls);
editor.addEventListener('input',()=>{schedule();updateColorControls()});
title.addEventListener('input',schedule);
document.addEventListener('selectionchange',()=>{const sel=window.getSelection();if(sel&&sel.rangeCount&&editor.contains(sel.anchorNode)&&editor.contains(sel.focusNode)){if(!sel.isCollapsed)savedRange=sel.getRangeAt(0).cloneRange();updateColorControls()}});
notes.addEventListener('change',()=>{persist();openNote(notes.value)});

$('newNote').onclick=()=>{persist();const id=uid();db[id]={name:'新しいノート',title:'',html:''};current=id;renderNotes();openNote(id);title.focus();persist()};
$('renameNote').onclick=()=>{const n=prompt('ノートの名前',db[current]?.name||'ノート');if(n&&n.trim()){db[current].name=n.trim();renderNotes();schedule()}};
$('deleteNote').onclick=()=>{if(Object.keys(db).length===1){alert('最後のノートは削除できません。');return}if(confirm('このノートを削除しますか？')){delete db[current];current=Object.keys(db)[0];renderNotes();openNote(current);persist()}};

function applyStyle(prop,value){
 restoreEditorSelection();
 const sel=window.getSelection();
 if(!sel||sel.isCollapsed||!savedRange){
  status.textContent='変更したい文字を選択してからサイズ変更を行ってください。';
  return;
 }
 try{
  const range=savedRange.cloneRange();
  const span=document.createElement('span');
  span.style[prop]=value;
  span.appendChild(range.extractContents());
  range.insertNode(span);
  
  if(prop==='fontSize'){
   span.querySelectorAll('*').forEach(child=>{child.style.fontSize=''});
  }
  
  const newRange=document.createRange();
  newRange.selectNodeContents(span);
  sel.removeAllRanges();
  sel.addRange(newRange);
  savedRange=newRange.cloneRange();
  status.textContent='選択した文字のサイズを変更しました。';
  schedule();
 }catch(e){
  status.textContent='文字の変更に失敗しました。';
 }
}

const sizeSelect=$('size');
sizeSelect.addEventListener('focus',saveSelection);
sizeSelect.addEventListener('mousedown',saveSelection);
sizeSelect.addEventListener('change',e=>{
 if(e.target.value){
  applyStyle('fontSize',e.target.value);
 }
});

$('color').oninput=e=>{applyStyle('color',e.target.value)};
$('highlight').oninput=e=>{
 restoreEditorSelection();
 if(!document.execCommand('hiliteColor',false,e.target.value))document.execCommand('backColor',false,e.target.value);
 schedule();
};

document.querySelectorAll('[data-cmd]').forEach(b=>b.onclick=()=>{restoreEditorSelection();document.execCommand(b.dataset.cmd,false,null);schedule()});
$('photoBtn').onclick=()=>{editor.focus();$('photoInput').click()};
$('photoInput').onchange=e=>{const f=e.target.files&&e.target.files[0];if(!f)return;if(!f.type.startsWith('image/')){alert('画像ファイルを選んでください。');return}if(f.size>8*1024*1024){alert('写真が大きすぎます。8MB以下の画像を選んでください。');e.target.value='';return}const r=new FileReader();r.onload=()=>{const img=document.createElement('img');img.src=r.result;img.alt=f.name;editor.appendChild(img);selectElement(img);schedule()};r.readAsDataURL(f);e.target.value=''};

// 表の行・列を選択できるモーダル表示
$('tableBtn').onclick=()=>{
  const overlay=document.createElement('div');
  overlay.className='modal-overlay';
  overlay.innerHTML=`<div class="modal-box"><h3>表のサイズを選択</h3><label>行数 (1〜12)</label><select id="modalRows">${[...Array(12)].map((_,i)=>`<option value="${i+1}" ${i===2?'selected':''}>${i+1}行</option>`).join('')}</select><label>列数 (1〜8)</label><select id="modalCols">${[...Array(8)].map((_,i)=>`<option value="${i+1}" ${i===2?'selected':''}>${i+1}列</option>`).join('')}</select><div class="modal-buttons"><button id="modalCancel">キャンセル</button><button id="modalOk">追加</button></div></div>`;
  document.body.appendChild(overlay);
  
  overlay.querySelector('#modalCancel').onclick=()=>overlay.remove();
  overlay.querySelector('#modalOk').onclick=()=>{
    const r=parseInt($('modalRows').value,10);
    const c=parseInt($('modalCols').value,10);
    overlay.remove();
    
    const t=document.createElement('table');const b=document.createElement('tbody');
    for(let i=0;i<r;i++){const tr=document.createElement('tr');for(let j=0;j<c;j++){const td=document.createElement('td');td.contentEditable='true';td.style.textAlign='center';td.style.verticalAlign='middle';td.innerHTML='　';tr.appendChild(td)}b.appendChild(tr)}
    t.appendChild(b);editor.appendChild(t);selectElement(t);schedule();
  };
};

$('deleteElement').onclick=()=>{if(!selected||!editor.contains(selected)){alert('先に削除したい写真か表をタップして選択してください。');return}selected.remove();selected=null;schedule()};
editor.addEventListener('contextmenu',e=>{const cell=e.target.closest('td,th');if(!cell)return;e.preventDefault();const v=prompt('セルの縦位置を入力：上 / 中 / 下','中');if(v){cell.style.verticalAlign=v==='上'?'top':v==='下'?'bottom':'middle';schedule()}});

// ---- バックアップ / 復元 / 永続ストレージ ----
function cleanHtml(html){const t=document.createElement('template');t.innerHTML=String(html||'');t.content.querySelectorAll('script,iframe,object,embed,link,meta,style,base,form').forEach(n=>n.remove());t.content.querySelectorAll('*').forEach(n=>{[...n.attributes].forEach(a=>{const k=a.name.toLowerCase(),v=String(a.value).trim().toLowerCase();if(k.startsWith('on')||((k==='href'||k==='src'||k==='xlink:href')&&v.startsWith('javascript:')))n.removeAttribute(a.name)})});return t.innerHTML}
$('exportBtn').onclick=async()=>{
  persist();
  const d=new Date(),p=n=>String(n).padStart(2,'0');
  const name='ore-no-chiri-backup-'+d.getFullYear()+p(d.getMonth()+1)+p(d.getDate())+'.json';
  const file=new File([JSON.stringify({app:'ore-no-chiri',version:1,exported:d.toISOString(),notes:db})],name,{type:'application/json'});
  try{
    if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:name});status.textContent='バックアップを書き出しました。';return}
  }catch(e){if(e&&e.name==='AbortError')return}
  const a=document.createElement('a');a.href=URL.createObjectURL(file);a.download=name;document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),5000);
  status.textContent='バックアップをダウンロードしました。';
};
$('importBtn').onclick=()=>$('importInput').click();
$('importInput').onchange=e=>{
  const f=e.target.files&&e.target.files[0];e.target.value='';if(!f)return;
  const r=new FileReader();
  r.onload=()=>{
    try{
      const data=JSON.parse(r.result);const src=data&&data.notes&&typeof data.notes==='object'?data.notes:data;
      const items=Object.values(src||{}).filter(n=>n&&typeof n==='object'&&typeof n.html==='string');
      if(!items.length){alert('読み込めるノートが見つかりませんでした。');return}
      if(!confirm(items.length+'件のノートを追加で読み込みます。今のノートは消えません。よろしいですか？'))return;
      persist();let last='';
      items.forEach(n=>{const id=uid();db[id]={name:String(n.name||n.title||'復元したノート').slice(0,120),title:String(n.title||'').slice(0,120),html:cleanHtml(n.html)};last=id});
      current=last;renderNotes();openNote(last);persist();
      status.textContent=items.length+'件のノートを復元しました。';
    }catch(err){alert('ファイルを読み込めませんでした。バックアップのファイルか確認してください。')}
  };
  r.readAsText(f);
};
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
window.addEventListener('beforeunload',persist);window.addEventListener('pagehide',persist);document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')persist()});load();
})();
</script></body></html>
